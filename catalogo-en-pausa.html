<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101010">
  <title>HAKI | Pausa temporal</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:#f4f4f4;color:#121212;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,560px);text-align:center}
    .brand{font-weight:900;font-size:54px;letter-spacing:-.085em;line-height:1}
    .rule{width:44px;height:3px;background:#111;margin:36px auto 30px}
    h1{font-size:clamp(24px,6vw,37px);font-weight:850;line-height:1.1;letter-spacing:-.045em;margin:0 0 20px}
    p{max-width:420px;margin:0 auto;color:#626262;line-height:1.65;font-size:15px}
    footer{font-size:11px;font-weight:700;letter-spacing:.15em;margin-top:56px;color:#858585}
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="HAKI">HAKI</div>
    <div class="rule"></div>
    <h1>CATÁLOGO TEMPORALMENTE NO DISPONIBLE</h1>
    <p>Estamos haciendo una pausa temporal. Gracias por tu comprensión. Volveremos pronto.</p>
    <footer>HAKI · EL SALVADOR</footer>
  </main>
</body>
</html>
